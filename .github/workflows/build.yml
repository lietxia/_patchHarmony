name: Build GKI

on:
  push:
    paths:
      - 'src/**'
      - 'Makefile'
      - 'mk/**'
      - 'deps.lst'
      - 'scripts/fetch-deps.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        include:
          - kmi: android12-5.10
            image: android12-5.10-20260313
          - kmi: android13-5.10
            image: android13-5.10-20260313
          - kmi: android13-5.15
            image: android13-5.15-20260313
          - kmi: android14-5.15
            image: android14-5.15-20260313
          - kmi: android14-6.1
            image: android14-6.1-20260313
          - kmi: android15-6.6
            image: android15-6.6-20260313
          - kmi: android16-6.12
            image: android16-6.12-20260313
          - kmi: android17-6.18
            image: android17-6.18-20260828
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch deps
        env:
          KMSDK_TOKEN: ${{ secrets.KMSDK_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${KMSDK_TOKEN}@github.com/".insteadOf "git@github.com:"
          scripts/fetch-deps.sh

      - name: Build ${{ matrix.kmi }}
        run: |
          make VER=${{ matrix.kmi }} > build.log 2>&1 || { tail -50 build.log; exit 1; }
          tail -5 build.log

      - name: Zero warning gate
        run: |
          if grep -nE "error:|warning:" build.log; then
            echo "build log is not clean"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: droid_lkm-${{ matrix.kmi }}
          path: |
            out/${{ matrix.kmi }}/droid_lkm.ko
            out/${{ matrix.kmi }}/droid_lkm_vendor.ko
          if-no-files-found: warn
